<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#122B5C">
<title>Hors ligne — STANDA COMMERCIAL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F5F7FB; color: #0F172A; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .box {
    background: #fff; border: 1px solid #E7ECF3; border-radius: 20px;
    max-width: 400px; width: 100%; padding: 40px 32px; text-align: center;
    box-shadow: 0 4px 16px rgba(15,23,42,.06);
  }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; background: #122B5C;
    margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
  }
  .logo img { width: 44px; height: 44px; }
  h1 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  p { font-size: 14px; color: #64748B; line-height: 1.6; margin-bottom: 6px; }
  .line { height: 3px; width: 48px; background: #122B5C; border-radius: 2px; margin: 18px auto; }
  button {
    margin-top: 22px; background: #122B5C; color: #fff; border: 0;
    border-radius: 12px; padding: 12px 24px; font-size: 14px; font-weight: 700;
    cursor: pointer; width: 100%;
  }
  button:active { opacity: .85; }
  .hint { margin-top: 14px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><img src="/apple-touch-icon.png" alt="STANDA"></div>
    <h1>Connexion Internet indisponible</h1>
    <div class="line"></div>
    <p>Certaines fonctionnalités nécessitent une connexion.</p>
    <p>Les données déjà chargées peuvent rester consultables.</p>
    <button onclick="location.reload()">Réessayer</button>
    <p class="hint">STANDA COMMERCIAL — Gestion de colis</p>
  </div>
  <script>
    // Reeseye otomatikman lè koneksyon an tounen
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
