name: Déployer les migrations Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Mettre à jour la base de production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - name: Récupérer le code validé
        uses: actions/checkout@v4

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # SEKIRITE / DYAGNOSTIK : verifye 3 sekrè yo prezan AVAN nou eseye
      # konekte — san sa a, yon sekrè vid bay yon erè CLI kriptik pi ba
      # (echèk sistematik ki difisil pou dyagnostike, sa k te pase depi
      # 2026-09-01). Okenn valè sekrè pa parèt nan lòg la.
      - name: Verifye sekrè yo prezan
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing PRODUCTION_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing PRODUCTION_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Sekrè GitHub sa yo manke oswa vid:$missing — ajoute yo nan Settings > Secrets and variables > Actions, epi relanse."
            exit 1
          fi
          echo "Tou 3 sekrè yo prezan (valè yo pa afiche)."

      - name: Lier la base de production
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Appliquer les nouvelles migrations
        # Dènye liy erè yo vin yon "annotation" GitHub: lizib nan rezime run lan
        # san yo pa bezwen louvri jounal konplè a.
        # GitHub Actions pa gen IPv6, epi adrès dirèk baz la se IPv6 sèlman.
        # Nou mande API Supabase la adrès pooler IPv4 a (mòd "session", pò 5432)
        # epi nou bay CLI a URL konplè a. Modpas la ankode, li pa janm afiche.
        run: |
          set +e
          pooler=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler")
          host=$(echo "$pooler" | jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_host // empty')
          user=$(echo "$pooler" | jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_user // empty')
          if [ -z "$host" ] || [ -z "$user" ]; then
            echo "::error title=Pooler Supabase::Adresse du pooler introuvable via l'API (jeton ou projet invalide)."
            exit 1
          fi
          pw=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$pw"
          echo "Pooler : $host:5432 (utilisateur $user)"
          supabase db push --db-url "postgresql://$user:$pw@$host:5432/postgres" 2>&1 | tee push.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -v -i -E 'password|token|postgres(ql)?://' push.log | tail -n 8 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=supabase db push (exit $status)::$msg"
          fi
          exit $status
